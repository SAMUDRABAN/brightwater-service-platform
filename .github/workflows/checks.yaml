name: Verify Brightwater
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: brightwater_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7.4
        ports: ['6379:6379']
    defaults:
      run: {working-directory: backend}
    env:
      BW_ENVIRONMENT: test
      BW_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/brightwater_test
      BW_REDIS_URL: redis://localhost:6379/1
      BW_OPERATOR_TOKEN: ci-only-isolated-operator-token-not-for-deployment
      BW_RUNTIME_TOKEN: ci-only-isolated-runtime-token-not-for-deployment
      BW_DIALING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: {version: '0.11.19', python-version: '3.12'}
      - run: uv sync --frozen --extra dev --extra voice
      - run: uv run python ../scripts/check-version.py
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run ruff check .
      - run: uv run pytest -q
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: {working-directory: web}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: '10.22.0'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
