[project]
name = "brightwater"
version = "0.3.1"
description = "Brightwater calling policy, booking and campaign control plane"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.162,<0.163",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "celery[redis]>=5.5,<6",
  "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
  "cryptography>=44,<47",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
voice = ["livekit-agents==1.8.10", "livekit-api>=1.2.2,<1.3", "livekit-plugins-openai==1.8.10", "livekit-plugins-elevenlabs==1.8.10", "livekit-plugins-silero==1.8.10"]

[project.scripts]
brightwater = "brightwater.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.setuptools.package-data]
"brightwater.managed" = ["*.txt"]
